<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DR.BOT Live Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #1e293b;
    color: #f1f5f9;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #cbd5e1;
    font-size: 13px;
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #2d3f57;
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    font-size: 14px;
    border-bottom: 1px solid #475569;
  }
  th {
    background: #1e293b;
    color: #cbd5e1;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.no_response { background: #2d3f57; color: #d1d5db; border: 1px solid #4b5563; }
  .badge.both { background: #7f1d1d; color: #fecaca; }
  .badge.medical { background: #7c2d12; color: #fed7aa; }
  .badge.resource { background: #78350f; color: #fde68a; }
  .empty {
    padding: 40px;
    text-align: center;
    color: #6b7280;
  }
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: #2d3f57;
    color: #cbd5e1;
    border: 1px solid #475569;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .filter-btn:hover { background: #475569; }
  .filter-btn.active {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
  }
  tr.resolved { opacity: 0.45; }
  tr.resolved td { text-decoration: line-through; }
  .resolve-btn {
    background: #475569;
    color: #e5e7eb;
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .resolve-btn:hover { background: #4b5563; }
  .resolve-btn.undo {
    background: transparent;
    color: #cbd5e1;
    text-decoration: underline;
  }
  #map {
    width: 100%;
    height: 350px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid #475569;
  }
  .map-popup { font-size: 13px; line-height: 1.5; }
  .map-popup .popup-status { font-weight: 600; }
  .section-label {
    color: #cbd5e1;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    margin-top: 20px;
  }
  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: #2d3f57;
    border: 1px solid #475569;
    border-radius: 8px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 140px;
  }
  .stat-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .stat-number {
    font-size: 22px;
    font-weight: 700;
    color: #e5e7eb;
  }
  .stat-label {
    font-size: 11px;
    color: #cbd5e1;
    text-transform: uppercase;
  }
  .device-panel {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .device-card {
    background: #2d3f57;
    border: 1px solid #475569;
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 160px;
    max-width: 250px;
    flex: 1 1 18%;
  }
  .device-card.offline {
    opacity: 0.45;
    border-color: #ef4444;
  }
  .device-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .device-name {
    font-size: 14px;
    font-weight: 600;
  }
  .device-online {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .device-online.on { background: #14532d; color: #bbf7d0; }
  .device-online.off { background: #7f1d1d; color: #fecaca; }
  .device-detail {
    font-size: 12px;
    color: #cbd5e1;
    margin-bottom: 2px;
  }
  .battery-bar {
    height: 6px;
    background: #475569;
    border-radius: 3px;
    margin-top: 6px;
    overflow: hidden;
  }
  .battery-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }
</style>
</head>
<body>
  <h1>DR.BOT Live Dashboard</h1>
  <div class="subtitle">Auto-refreshes every 3 seconds</div>

  <div class="stats-bar" id="stats-bar">
    <div class="stat-card"><div class="stat-dot" style="background:#94a3b8"></div><div><div class="stat-number" id="stat-no_response">0</div><div class="stat-label">No Response</div></div></div>
    <div class="stat-card"><div class="stat-dot" style="background:#ef4444"></div><div><div class="stat-number" id="stat-both">0</div><div class="stat-label">Both Need</div></div></div>
    <div class="stat-card"><div class="stat-dot" style="background:#f97316"></div><div><div class="stat-number" id="stat-medical">0</div><div class="stat-label">Medical</div></div></div>
    <div class="stat-card"><div class="stat-dot" style="background:#eab308"></div><div><div class="stat-number" id="stat-resource">0</div><div class="stat-label">Resources</div></div></div>
  </div>

  <div class="filters" id="resolved-filters">
    <button class="filter-btn active" data-resolved="unresolved">Unresolved</button>
    <button class="filter-btn" data-resolved="resolved">Resolved</button>
    <button class="filter-btn" data-resolved="all">All</button>
  </div>
  <div class="filters" id="status-filters">
    <button class="filter-btn active" data-status="all">All statuses</button>
    <button class="filter-btn" data-status="no_response">No Response</button>
    <button class="filter-btn" data-status="both">Both Need</button>
    <button class="filter-btn" data-status="medical">Needs Medical</button>
    <button class="filter-btn" data-status="resource">Needs Resources</button>
  </div>

  <div id="map"></div>

  <div class="section-label">Devices</div>
  <div class="device-panel" id="device-panel">
    <div class="device-card"><div class="device-detail">No devices reporting yet…</div></div>
  </div>

  <div class="section-label">Reports</div>
  <table>
    <thead>
      <tr>
        <th>Status</th>
        <th>Device</th>
        <th>Time</th>
        <th>Location</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="report-body">
      <tr><td colspan="5" class="empty">Waiting for reports…</td></tr>
    </tbody>
  </table>

<script>
const statusLabels = {
  no_response: "No Response",
  both: "Both Need",
  medical: "Needs Medical",
  resource: "Needs Resources"
};

const statusColors = {
  no_response: '#94a3b8',
  both: '#ef4444',
  medical: '#f97316',
  resource: '#eab308'
};

// Higher number = more urgent. Used for sorting only, not displayed directly.
const statusPriority = {
  no_response: 5,
  both: 4,
  medical: 3,
  resource: 2
};

// Initialize map centered on Brisbane
const map = L.map('map').setView([-27.47, 153.02], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

let markers = [];
let deviceMarkers = [];

function updateMap(reports) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const validReports = reports.filter(r => r.lat != null && r.lon != null);

  validReports.forEach(r => {
    const color = statusColors[r.status] || '#cbd5e1';
    const label = statusLabels[r.status] || r.status;
    const isResolved = !!r.resolved;
    const size = isResolved ? 26 : 34;

    const pinSvg = `
      <svg width="${size}" height="${size * 1.3}" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg"
           style="opacity:${isResolved ? 0.45 : 1}; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));">
        <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20c0-6.6-5.4-12-12-12z"
              fill="${color}" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="4.5" fill="#ffffff"/>
      </svg>
    `;

    const marker = L.marker([r.lat, r.lon], {
      icon: L.divIcon({
        className: '',
        html: pinSvg,
        iconSize: [size, size * 1.3],
        iconAnchor: [size / 2, size * 1.3]
      })
    }).addTo(map);

    marker.bindPopup(`
      <div class="map-popup">
        <div class="popup-status" style="color:${color}">${label}</div>
        <div>Device: ${r.device_id}</div>
        <div>Time: ${r.timestamp}</div>
        <div>${isResolved ? '✓ Resolved' : 'Awaiting response'}</div>
      </div>
    `);

    markers.push(marker);
  });

  if (validReports.length > 0) {
    const bounds = L.latLngBounds(validReports.map(r => [r.lat, r.lon]));
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  }
}

let currentResolvedFilter = 'unresolved';
let currentStatusFilter = 'all';

document.getElementById('resolved-filters').addEventListener('click', (e) => {
  if (!e.target.matches('.filter-btn')) return;
  currentResolvedFilter = e.target.dataset.resolved;
  document.querySelectorAll('#resolved-filters .filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  refresh();
});

document.getElementById('status-filters').addEventListener('click', (e) => {
  if (!e.target.matches('.filter-btn')) return;
  currentStatusFilter = e.target.dataset.status;
  document.querySelectorAll('#status-filters .filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  refresh();
});

async function setResolved(id, resolved) {
  const action = resolved ? 'resolve' : 'unresolve';
  try {
    await fetch(`/api/reports/${id}/${action}`, { method: 'PATCH' });
    refresh();
  } catch (err) {
    console.error('Failed to update report', err);
  }
}

async function updateStats() {
  try {
    const res = await fetch('/api/reports');
    const all = await res.json();
    document.getElementById('stat-no_response').textContent = all.filter(r => r.status === 'no_response').length;
    document.getElementById('stat-both').textContent = all.filter(r => r.status === 'both').length;
    document.getElementById('stat-medical').textContent = all.filter(r => r.status === 'medical').length;
    document.getElementById('stat-resource').textContent = all.filter(r => r.status === 'resource').length;
  } catch (err) {}
}

const deviceStatusLabels = {
  scanning: 'Scanning',
  locked: 'Locked on target',
  idle: 'Idle'
};

function formatSecondsAgo(seconds) {
  if (seconds == null) return '—';
  if (seconds < 60) return `${seconds}s ago`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  return `${Math.floor(seconds / 3600)}h ago`;
}

async function updateDevices() {
  try {
    const res = await fetch('/api/devices');
    const devices = await res.json();
    const panel = document.getElementById('device-panel');

    deviceMarkers.forEach(m => map.removeLayer(m));
    deviceMarkers = [];

    if (devices.length === 0) {
      panel.innerHTML = '<div class="device-card"><div class="device-detail">No devices reporting yet…</div></div>';
      return;
    }

    devices.forEach(d => {
      if (d.lat == null || d.lon == null) return;
      const isOnline = !!d.online;
      const marker = L.marker([d.lat, d.lon], {
        icon: L.divIcon({
          className: '',
          html: `<div style="
            background: ${isOnline ? '#3b82f6' : '#6b7280'};
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            border: 2px solid ${isOnline ? '#ffffff' : '#cbd5e1'};
            white-space: nowrap;
            opacity: ${isOnline ? 1 : 0.5};
          ">${d.device_id}</div>`,
          iconSize: null,
          iconAnchor: [20, 20]
        })
      }).addTo(map);

      const statusText = deviceStatusLabels[d.status] || d.status || '—';
      marker.bindPopup(`
        <div class="map-popup">
          <div class="popup-status" style="color:#3b82f6">${d.device_id}</div>
          <div>Status: ${statusText}</div>
          <div>Battery: ${d.battery != null ? d.battery + '%' : '—'}</div>
          <div>${isOnline ? '🟢 Online' : '🔴 Offline'}</div>
          <div>Updated: ${formatSecondsAgo(d.seconds_ago)}</div>
        </div>
      `);
      deviceMarkers.push(marker);
    });

    panel.innerHTML = devices.map(d => {
      const isOnline = !!d.online;
      const bat = d.battery != null ? d.battery : '—';
      const batColor = d.battery > 50 ? '#22c55e' : d.battery > 20 ? '#f59e0b' : '#ef4444';
      const statusText = deviceStatusLabels[d.status] || d.status || '—';
      return `
        <div class="device-card ${isOnline ? '' : 'offline'}">
          <div class="device-header">
            <span class="device-name">${d.device_id}</span>
            <span class="device-online ${isOnline ? 'on' : 'off'}">${isOnline ? 'Online' : 'Offline'}</span>
          </div>
          <div class="device-detail">Status: ${statusText}</div>
          <div class="device-detail">Battery: ${bat}%</div>
          <div class="device-detail" style="opacity:0.7">Updated ${formatSecondsAgo(d.seconds_ago)}</div>
          <div class="battery-bar">
            <div class="battery-fill" style="width:${d.battery || 0}%; background:${batColor}"></div>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {}
}

async function refresh() {
  try {
    updateStats();
    updateDevices();

    const params = new URLSearchParams();
    if (currentResolvedFilter === 'unresolved') params.set('resolved', 'false');
    if (currentResolvedFilter === 'resolved') params.set('resolved', 'true');
    if (currentStatusFilter !== 'all') params.set('status', currentStatusFilter);

    const res = await fetch(`/api/reports?${params.toString()}`);
    const reports = await res.json();

    // Sort by urgency (highest priority first), most recent within same priority
    reports.sort((a, b) => {
      const priorityDiff = (statusPriority[b.status] || 0) - (statusPriority[a.status] || 0);
      if (priorityDiff !== 0) return priorityDiff;
      return new Date(b.timestamp) - new Date(a.timestamp);
    });

    const body = document.getElementById('report-body');

    updateMap(reports);

    if (reports.length === 0) {
      body.innerHTML = '<tr><td colspan="5" class="empty">No matching reports…</td></tr>';
      return;
    }

    body.innerHTML = reports.map(r => {
      const label = statusLabels[r.status] || r.status;
      const loc = (r.lat != null && r.lon != null)
        ? `${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}`
        : '—';
      const isResolved = !!r.resolved;
      const actionBtn = isResolved
        ? `<button class="resolve-btn undo" onclick="setResolved(${r.id}, false)">Undo</button>`
        : `<button class="resolve-btn" onclick="setResolved(${r.id}, true)">Mark resolved</button>`;
      return `
        <tr class="${isResolved ? 'resolved' : ''}">
          <td><span class="badge ${r.status}">${label}</span></td>
          <td>${r.device_id}</td>
          <td>${r.timestamp}</td>
          <td>${loc}</td>
          <td>${actionBtn}</td>
        </tr>
      `;
    }).join('');
  } catch (err) {
    console.error('Failed to fetch reports', err);
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
