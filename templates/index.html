<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DR.BOT Live Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #111827;
    color: #e5e7eb;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #9ca3af;
    font-size: 13px;
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #1f2937;
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    font-size: 14px;
    border-bottom: 1px solid #374151;
  }
  th {
    background: #111827;
    color: #9ca3af;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.medical { background: #7f1d1d; color: #fecaca; }
  .badge.resource { background: #78350f; color: #fde68a; }
  .badge.ok { background: #14532d; color: #bbf7d0; }
  .empty {
    padding: 40px;
    text-align: center;
    color: #6b7280;
  }
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: #1f2937;
    color: #9ca3af;
    border: 1px solid #374151;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .filter-btn:hover { background: #374151; }
  .filter-btn.active {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
  }
  tr.resolved { opacity: 0.45; }
  tr.resolved td { text-decoration: line-through; }
  .resolve-btn {
    background: #374151;
    color: #e5e7eb;
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .resolve-btn:hover { background: #4b5563; }
  .resolve-btn.undo {
    background: transparent;
    color: #9ca3af;
    text-decoration: underline;
  }
  #map {
    width: 100%;
    height: 350px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid #374151;
  }
  .map-popup { font-size: 13px; line-height: 1.5; }
  .map-popup .popup-status { font-weight: 600; }
  .section-label {
    color: #9ca3af;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    margin-top: 20px;
  }
  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 8px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 140px;
  }
  .stat-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .stat-number {
    font-size: 22px;
    font-weight: 700;
    color: #e5e7eb;
  }
  .stat-label {
    font-size: 11px;
    color: #9ca3af;
    text-transform: uppercase;
  }
  .device-panel {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .device-card{
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 180px;
    flex: 1;
  }
  .device-card.offline{
    opacity: 0.45;
    border-color: #ef4444;
  }
  .device-header{
    display: flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom: 8px;
  }
  .device-name {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .device-online {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .device-online.on{ background:#14532d; color: #bbf7d0; }
  .device-online.off{ background: #7f1d1d; color: #fecaca; }
  .device-detail {
    font-size: 12px;
    color: #9ca3af;
    margin-bottom: 2px;
  }
  .battery-bar {
    height: 6px;
    background: #374151;
    border-radius: 3px;
    margin-top: 6px;
    overflow: hidden;
  }
  .battery-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }
</style>
</head>
<body>
  <h1>DR.BOT Live Dashboard</h1>
  <div class="subtitle">Auto-refreshes every 3 seconds</div>

  <div class="stats-bar" id="stats-bar">
    <div class="stat-card"><div class="stat-dot" style="background:#ef4444"></div><div><div class="stat-number" id="stat-medical">0</div><div class="stat-label">Medical</div></div></div>
    <div class="stat-card"><div class="stat-dot" style="background:#f59e0b"></div><div><div class="stat-number" id="stat-resource">0</div><div class="stat-label">Resources</div></div></div>
    <div class="stat-card"><div class="stat-dot" style="background:#22c55e"></div><div><div class="stat-number" id="stat-ok">0</div><div class="stat-label">OK</div></div></div>
  </div>

  <div class="filters" id="resolved-filters">
    <button class="filter-btn active" data-resolved="unresolved">Unresolved</button>
    <button class="filter-btn" data-resolved="resolved">Resolved</button>
    <button class="filter-btn" data-resolved="all">All</button>
  </div>
  <div class="filters" id="status-filters">
    <button class="filter-btn active" data-status="all">All statuses</button>
    <button class="filter-btn" data-status="medical">Needs Medical</button>
    <button class="filter-btn" data-status="resource">Needs Resources</button>
    <button class="filter-btn" data-status="ok">OK</button>
  </div>

  <div id="map"></div>

  <div class="section-label">Devices</div>
  <div class="device-panel" id="device-panel">
    <div class="device-card"><div class="device-detail">No devices reporting yet...</div></div>
  </div>

  <div class="section-label">Reports</div>
  <table>
    <thead>
      <tr>
        <th>Status</th>
        <th>Device</th>
        <th>Time</th>
        <th>Location</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="report-body">
      <tr><td colspan="5" class="empty">Waiting for reports…</td></tr>
    </tbody>
  </table>

<script>
const statusLabels = {
  medical: "Needs Medical",
  resource: "Needs Resources",
  ok: "OK"
};

const statusColors = {
  medical: '#ef4444',
  resource: '#f59e0b',
  ok: '#22c55e'
};

// Initialize map centered on Brisbane
const map = L.map('map').setView([-27.47, 153.02], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

let markers = [];
let deviceMarkers = [];

function updateMap(reports) {
  // Clear old markers
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const validReports = reports.filter(r => r.lat != null && r.lon != null);

  validReports.forEach(r => {
    const color = statusColors[r.status] || '#9ca3af';
    const label = statusLabels[r.status] || r.status;
    const isResolved = !!r.resolved;

    const marker = L.circleMarker([r.lat, r.lon], {
      radius: isResolved ? 6 : 10,
      fillColor: color,
      color: isResolved ? '#6b7280' : '#ffffff',
      weight: 2,
      opacity: isResolved ? 0.4 : 1,
      fillOpacity: isResolved ? 0.3 : 0.85
    }).addTo(map);

    marker.bindPopup(`
      <div class="map-popup">
        <div class="popup-status" style="color:${color}">${label}</div>
        <div>Device: ${r.device_id}</div>
        <div>Time: ${r.timestamp}</div>
        <div>${isResolved ? '✓ Resolved' : 'Awaiting response'}</div>
      </div>
    `);

    markers.push(marker);
  });

  // Auto-fit map to show all markers
  if (validReports.length > 0) {
    const bounds = L.latLngBounds(validReports.map(r => [r.lat, r.lon]));
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  }
}

let currentResolvedFilter = 'unresolved'; // 'unresolved' | 'resolved' | 'all'
let currentStatusFilter = 'all';

document.getElementById('resolved-filters').addEventListener('click', (e) => {
  if (!e.target.matches('.filter-btn')) return;
  currentResolvedFilter = e.target.dataset.resolved;
  document.querySelectorAll('#resolved-filters .filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  refresh();
});

document.getElementById('status-filters').addEventListener('click', (e) => {
  if (!e.target.matches('.filter-btn')) return;
  currentStatusFilter = e.target.dataset.status;
  document.querySelectorAll('#status-filters .filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  refresh();
});

async function setResolved(id, resolved) {
  const action = resolved ? 'resolve' : 'unresolve';
  try {
    await fetch(`/api/reports/${id}/${action}`, { method: 'PATCH' });
    refresh();
  } catch (err) {
    console.error('Failed to update report', err);
  }
}

async function updateStats() {
  try {
    const res = await fetch('/api/reports');
    const all = await res.json();
    document.getElementById('stat-medical').textContent = all.filter(r => r.status === 'medical').length;
    document.getElementById('stat-resource').textContent = all.filter(r => r.status === 'resource').length;
    document.getElementById('stat-ok').textContent = all.filter(r => r.status === 'ok').length;
  } catch (err) {}
}

const deviceStatusLabels = {
  scanning: 'Scanning',
  locked: 'Locked on target',
  idle: 'Idle'
}

async function updateDevices() {
  try{
    const res = await fetch('/api/devices');
    const devices = await res.json();
    const panel = document.getElementById('device-panel');

    // Clear old device markers from map
    deviceMarkers.forEach(m => map.removeLayer(m));
    deviceMarkers = [];

    if (devices.length === 0) {
      panel.innerHTML = '<div class="device-card"><div class="device-detail">No devices reporting yet...</div></div>';
      return;
    }

    // Draw device markers on map
    devices.forEach(d => {
      if (d.lat == null || d.lon == null) return;
      const isOnline = !!d.online;
      const marker = L.marker([d.lat, d.lon], {
        icon: L.divIcon({
          className: '',
          html: `<div style="
            background: ${isOnline ? '#3b82f6' : '#6b7280'};
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            border: 2px solid ${isOnline ? '#ffffff' : '#9ca3af'};
            white-space: nowrap;
            opacity: ${isOnline ? 1 : 0.5};
          ">${d.device_id}</div>`,
          iconSize: null,
          iconAnchor: [20, 20]
        })
      }).addTo(map);

      const batColor = d.battery > 50 ? '#22c55e' : d.battery > 20 ? '#f59e0b' : '#ef4444';
      const statusText = deviceStatusLabels[d.status] || d.status || '—';
      marker.bindPopup(`
        <div class="map-popup">
          <div class="popup-status" style="color:#3b82f6">${d.device_id}</div>
          <div>Status: ${statusText}</div>
          <div>Battery: ${d.battery != null ? d.battery + '%' : '—'}</div>
          <div>${isOnline ? '🟢 Online' : '🔴 Offline'}</div>
        </div>
      `);
      deviceMarkers.push(marker);
    });

    // Render cards
    panel.innerHTML = devices.map(d => {
        const isOnline = !!d.online;
        const bat = d.battery != null ? d.battery : '—';
        const batColor = d.battery > 50 ? '#22c55e' : d.battery > 20 ? '#f59e0b' : '#ef4444';
        const statusText = deviceStatusLabels[d.status] || d.status || '—';
        return `
          <div class="device-card ${isOnline ? '' : 'offline'}">
            <div class="device-header">
              <span class="device-name">${d.device_id}</span>
              <span class="device-online ${isOnline ? 'on' : 'off'}">${isOnline ? 'Online' : 'Offline'}</span>
            </div>
            <div class="device-detail">Status: ${statusText}</div>
            <div class="device-detail">Battery: ${bat}%</div>
            <div class="battery-bar">
              <div class="battery-fill" style="width:${d.battery || 0}%; background:${batColor}"></div>
            </div>
          </div>
        `;
      }).join('');
  } catch (err) {}
}

async function refresh() {
  try {
    updateStats();
        updateDevices();

    const params = new URLSearchParams();
    if (currentResolvedFilter === 'unresolved') params.set('resolved', 'false');
    if (currentResolvedFilter === 'resolved') params.set('resolved', 'true');
    if (currentStatusFilter !== 'all') params.set('status', currentStatusFilter);

    const res = await fetch(`/api/reports?${params.toString()}`);
    const reports = await res.json();
    const body = document.getElementById('report-body');

    updateMap(reports);

    if (reports.length === 0) {
      body.innerHTML = '<tr><td colspan="5" class="empty">No matching reports…</td></tr>';
      return;
    }

    body.innerHTML = reports.map(r => {
      const label = statusLabels[r.status] || r.status;
      const loc = (r.lat != null && r.lon != null)
        ? `${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}`
        : '—';
      const isResolved = !!r.resolved;
      const actionBtn = isResolved
        ? `<button class="resolve-btn undo" onclick="setResolved(${r.id}, false)">Undo</button>`
        : `<button class="resolve-btn" onclick="setResolved(${r.id}, true)">Mark resolved</button>`;
      return `
        <tr class="${isResolved ? 'resolved' : ''}">
          <td><span class="badge ${r.status}">${label}</span></td>
          <td>${r.device_id}</td>
          <td>${r.timestamp}</td>
          <td>${loc}</td>
          <td>${actionBtn}</td>
        </tr>
      `;
    }).join('');
  } catch (err) {
    console.error('Failed to fetch reports', err);
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
